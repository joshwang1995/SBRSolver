# SBRSolver simulation settings: iBwave office scene with the receivers listed
# in RX_Office.dat. Transmitter position taken from the former main().
# Run with an explicit output directory (sbrsolver office.ini <dir>) so the
# reference results in output/ are not overwritten.
#
# This scene also shows the two ways of assigning materials to surfaces:
# an extra STL file with its own material ([geometry]) and overrides of
# whole coplanar surfaces by id ([surface_materials]). Surface ids are the
# CoplanarID field written to Faces.vtk; open it in ParaView to find them.

[scene]
stl_file = stl_files/office.stl
material = plaster_board     # walls and partitions unless overridden below

[geometry]
file = stl_files/office_glass_panel.stl   # glass panel closing the 2 m opening between x = 5 and x = 7 at y = 3
material = glass

[transmitter]
position = 0.835938 4.53906 2.5
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 2
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Office.dat

[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

[surface_materials]
4 = wood            # floor (z = 0)
5 = metal_5mm       # ceiling (z = 3)
12 = glass          # partition from (6, 6) to (11, 6)
