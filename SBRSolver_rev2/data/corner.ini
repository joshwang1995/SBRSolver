# SBRSolver simulation settings: corner scene with the receivers listed in
# RX_Corner.dat. Transmitter position taken from the former main().
# Run with an explicit output directory (sbrsolver corner.ini <dir>) so the
# reference results in output/ are not overwritten.

[scene]
stl_file = stl_files/corner.stl

[transmitter]
position = 0 0 2.5
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 2
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Corner.dat

[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
