# SBRSolver: Bahen floor plan with a dense receiver grid.
#
# Same scene, transmitter and materials as ../bahen.ini; the receivers are
# the fine layout of RX_Bahen_fine.dat: a 1 m grid at 1.5 m height over the
# whole floor area the transmitter can reach without passing through a wall
# (3608 receivers), kept 0.3 m away from every wall and pillar. Rooms that
# are closed off from the transmitter are left out because max_transmissions
# is 0. A 0.5 m grid (14589 receivers) is a 900 MB run at this tessellation;
# tools/generate_receivers.py --spacing 0.5 produces it when wanted.
# Run with an explicit output directory, e.g.
#   sbrsolver SBRSolver_rev2/data/fine/bahen.ini results/bahen_fine --view

[scene]
stl_file = ../stl_files/bahen.stl

[transmitter]
position = -10 0 1
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 4             # 2562 rays: the smallest level at which every path of this plane is found
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Bahen_fine.dat
[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
