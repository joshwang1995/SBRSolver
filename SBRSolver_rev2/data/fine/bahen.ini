# SBRSolver: Bahen floor plan with a dense receiver grid.
#
# Same scene, transmitter and materials as ../bahen.ini; the receivers are
# the fine layout of RX_Bahen_fine.dat: a 0.5 m grid at 1.5 m height over the
# floor area the transmitter can reach without passing through a wall (the
# hall around the transmitter and the corridors and rooms open to it; 6858
# receivers), kept 0.3 m away from every wall and pillar. The parts of the
# floor that walls seal off from the transmitter are left out: with
# max_transmissions = 0 nothing reaches them. Seven receivers in door
# recesses get no field with one reflection. Generated with
# tools/generate_receivers.py (the first line of the receiver file is the
# command). The run keeps a path list per launched ray and receiver
# (2562 x 6858 x 24 bytes, about 0.4 GB), which is why the tessellation
# stays at 4: an exact image-method check finds 32803 paths on this grid
# (6846 direct, 25957 single-bounce), of which the 2562 rays miss 78 grazing
# wall reflections, one each at 78 receivers (65 of them off by more than
# 0.3 dB, 33 by more than 3 dB, up to 10 dB). Tessellation 5 (four times the
# memory) finds 75 of them, tessellation 6 (16 times, 6.7 GB) all.
# Run with an explicit output directory, e.g.
#   sbrsolver SBRSolver_rev2/data/fine/bahen.ini results/bahen_fine --view

[scene]
stl_file = ../stl_files/bahen.stl

[transmitter]
position = -10 0 1
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 4             # 2562 rays: misses 78 of this grid's 32803 paths (see above); kept for memory
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Bahen_fine.dat
[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
