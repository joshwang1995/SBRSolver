# SBRSolver: office with a dense receiver grid.
#
# Same scene, transmitter and materials as ../office.ini; the receivers are
# the fine layout of RX_Office_fine.dat: a 0.25 m grid at 1.5 m height over
# every room of the 12 m x 9 m office (1728 receivers), offset by 0.125 m so
# no receiver lies on a partition. The room between x = 2 and x = 9 south of
# y = 3 is closed by the glass panel, the rooms on the east side have no
# line of sight to the transmitter and the partitions of the north-west room
# and of the corridor cast shadows, so 658 receivers get no field unless
# max_transmissions or max_reflections is raised. The tessellation is one
# level above ../office.ini: on this grid 642 rays miss a grazing wall
# reflection at a few receivers next to a partition. Generated with
# tools/generate_receivers.py (the first line of the receiver file is the
# command).
# Run with an explicit output directory, e.g.
#   sbrsolver SBRSolver_rev2/data/fine/office.ini results/office_fine --view

[scene]
stl_file = ../stl_files/office.stl
material = plaster_board     # walls and partitions unless overridden below

[geometry]
file = ../stl_files/office_glass_panel.stl   # glass panel closing the 2 m opening between x = 5 and x = 7 at y = 3
material = glass

[transmitter]
position = 0.835938 4.53906 2.5
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 4             # 2562 rays: 642 miss a grazing wall reflection at a few receivers 0.125 m from a partition on this dense grid
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Office_fine.dat
[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

[surface_materials]
4 = wood            # floor (z = 0)
5 = metal_5mm       # ceiling (z = 3)
12 = glass          # partition from (6, 6) to (11, 6)
