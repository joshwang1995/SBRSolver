# SBRSolver: corner (floor and one wall) with a dense receiver grid.
#
# Same scene, transmitter and materials as ../corner.ini; the receivers are
# the fine layout of RX_Corner_fine.dat: a 0.25 m grid at 1.5 m height over
# the whole 20 m x 20 m floor, offset by 0.125 m from the edges and kept
# 0.25 m away from the wall at y = 10 (6320 receivers). Generated with
# tools/generate_receivers.py (see the first line of the receiver file).
# Run with an explicit output directory, e.g.
#   sbrsolver SBRSolver_rev2/data/fine/corner.ini results/corner_fine --view

[scene]
stl_file = ../stl_files/corner.stl

[transmitter]
position = 0 0 2.5
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 2
antenna_type = hertzian_dipole

[receivers]
layout = file
file = RX_Corner_fine.dat
[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
