# SBRSolver: ground plane with a dense receiver line.
#
# Same scene, transmitter and materials as ../ground.ini; the receivers are
# the fine layout of RX_Ground_fine.dat: one every 0.1 m along the strip's
# centre line from y = 1 m to y = 999 m at 3 m height (9981 receivers), all
# above the 1001 m long ground plane. Generated with tools/generate_receivers.py
# (the first line of the receiver file is the command).
# Run with an explicit output directory, e.g.
#   sbrsolver SBRSolver_rev2/data/fine/ground.ini results/ground_fine --view

[scene]
stl_file = ../stl_files/ground.stl
# material = metal_5mm       # material of stl_file (default: the first [material])
save_edges = true            # write Edges.vtk
save_faces = true            # write Faces.vtk (includes each face's CoplanarID and MaterialID)

# Optional, repeatable: more STL files, each with its own material. Export one
# STL per material from Blender/CAD and list them here.
# [geometry]
# file = ../stl_files/windows.stl
# material = glass

[transmitter]
position = 0 0 5             # metres, global coordinates
coordinate_system = 0 1 0; 0 0 1; 1 0 0   # rows of the TX frame expressed in global coordinates
power_watts = 1
frequency_hz = 1.8e9
tessellation = 3             # icosahedron subdivision level; rays = 10*4^n + 2 (0 = 12, 1 = 42, 2 = 162, 3 = 642), max 8.
                             # 162 rays miss the ground reflection beyond 157 m on this 10 m wide strip; 642 find it everywhere.
antenna_type = hertzian_dipole   # isotropic | hertzian_dipole | half_wave_dipole
# pattern_file = TXPattern.dat   # measured pattern; read and validated but not applied yet

[receivers]
layout = file
file = RX_Ground_fine.dat
[ray_tracing]
max_reflections = 1
max_transmissions = 0
use_fresnel_coefficients = true
threads = 0                  # worker threads for ray launching and field computation (0 = all hardware threads)

# One [material] section per material, names must be unique. The first one is
# the default for stl_file; [scene] material, [geometry] and
# [surface_materials] select the others. frequency_hz defaults to the
# transmitter frequency.
[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

# Optional: override whole coplanar surfaces by id (the CoplanarID field of
# Faces.vtk); see office.ini for an example.
# [surface_materials]
# 4 = wood

[outputs]
ray_paths = true             # RayPath.vtk
receivers = true             # RxLocations.vtk
field_csv = true             # ElectricField.csv
icosahedron = false          # Icosahedron.vtk (launch directions)
viewer = false               # open the built-in 3D viewer after the run (also --view)
