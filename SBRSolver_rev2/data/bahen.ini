# SBRSolver simulation settings: Bahen Centre scene with a receiver plane.
# Transmitter position and receiver plane taken from the lines that were
# commented out in the former main(); treat them as a starting point.

[scene]
stl_file = stl_files/bahen.stl

[transmitter]
position = -10 0 1
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 2
antenna_type = hertzian_dipole

[receivers]
layout = plane
x_min = -18
y_min = -40
x_max = -17
y_max = 0
height = 1
resolution = 1

[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
