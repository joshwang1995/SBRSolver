# SBRSolver simulation settings: Bahen Centre scene with a receiver plane.
# The transmitter position comes from the lines that were commented out in
# the former main(). The receiver plane surrounds it inside the building
# (the plane that was commented out there, x = -18..-17, y = -40..0, lies
# where no direct or single-bounce path arrives at all). The walls of this
# scene are not axis-aligned, which is what makes it worth comparing with
# the reference solver.
# Run with an explicit output directory (sbrsolver bahen.ini <dir>) so the
# reference results in output/ are not overwritten.

[scene]
stl_file = stl_files/bahen.stl

[transmitter]
position = -10 0 1
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 4             # 2562 rays: the smallest level at which every path of this plane is found
antenna_type = hertzian_dipole

[receivers]
layout = plane               # 11 x 11 receivers around the transmitter, 0.5 m above it
x_min = -15
y_min = -5
x_max = -5
y_max = 5
height = 1.5
resolution = 1

[ray_tracing]
max_reflections = 1
max_transmissions = 0

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0
