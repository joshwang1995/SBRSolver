# SBRSolver simulation settings: office_two_tx.ini with the powers of the two
# transmitters added instead of their fields (transmitter_sum = power), as for
# two independent access points. The field written at a receiver is the root
# of the summed squared components of the two fields, so |E|^2 is the sum of
# the two powers and the phase is zero. Everything else is as office_two_tx.ini.
# Run with an explicit output directory: sbrsolver office_two_tx_power.ini <dir>

[scene]
stl_file = stl_files/office.stl
material = plaster_board     # walls and partitions unless overridden below

[geometry]
file = stl_files/office_glass_panel.stl   # glass panel closing the 2 m opening between x = 5 and x = 7 at y = 3
material = glass

[transmitter]
position = 0.835938 4.53906 2.5
coordinate_system = 0 1 0; 0 0 1; 1 0 0
power_watts = 1
frequency_hz = 1.8e9
tessellation = 3             # 162 rays miss 11 of the room's 292 single-bounce paths (344 with the 52 direct ones); 642 find them all
antenna_type = hertzian_dipole

[transmitter]
name = east
position = 10.5 4.5 2.5      # the other end of the room; everything else as the first transmitter

[receivers]
layout = file
file = RX_Office.dat

[ray_tracing]
max_reflections = 1
max_transmissions = 0
transmitter_sum = power    # the powers of the two transmitters add; coherent (default) adds their fields as phasors

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

[surface_materials]
4 = wood            # floor (z = 0)
5 = metal_5mm       # ceiling (z = 3)
12 = glass          # partition from (6, 6) to (11, 6)
