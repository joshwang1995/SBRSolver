# SBRSolver simulation settings: ground plane reference case.
#
# This file reproduces the results committed under output/ and is what the
# ctest regression test runs. File names are relative to this file's
# directory. Lines starting with '#' or ';' are comments, and '#' preceded by
# a space starts an inline comment.

[scene]
stl_file = stl_files/ground.stl
save_edges = true            # write Edges.vtk
save_faces = true            # write Faces.vtk

[transmitter]
position = 0 0 5             # metres, global coordinates
coordinate_system = 0 1 0; 0 0 1; 1 0 0   # rows of the TX frame expressed in global coordinates
power_watts = 1
frequency_hz = 1.8e9
tessellation = 2             # icosahedron subdivision level (0 = 12 rays, each level x4)
antenna_type = hertzian_dipole   # isotropic | hertzian_dipole | half_wave_dipole | array
# pattern_file = TXPattern.dat   # measured pattern; read and validated but not applied yet

[receivers]
layout = line                # line | plane | file
line_start = 0 0 3
line_end = 0 3000 3
resolution = 1               # metres between receivers
# For layout = plane: x_min, y_min, x_max, y_max, height, resolution
# For layout = file:  file = RX_Ground.dat

[ray_tracing]
max_reflections = 1
max_transmissions = 0
use_fresnel_coefficients = true

# One [material] section per material; the first one (id 0) is applied to
# every surface. frequency_hz defaults to the transmitter frequency.
[material]
name = metal_5mm
reflection_loss = 0.05
transmission_loss = 221.13
rel_conductivity = 1e6
rel_permittivity_re = 1
rel_permittivity_im = 0

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

[outputs]
ray_paths = true             # RayPath.vtk
receivers = true             # RxLocations.vtk
field_csv = true             # ElectricField.csv
icosahedron = false          # Icosahedron.vtk (launch directions)
