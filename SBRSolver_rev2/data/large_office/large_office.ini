# SBRSolver: a large office from its furniture plan with two access
# points radiating at once, one above the lab and one above the east open
# workstations. The field at every receiver is the sum of the fields from
# both; every path in RayPath.vtk carries the id of its access point.
#
# Geometry from tools/plan_to_stl.py. The new partitions, the glazed
# partitions, the desk screens and the curtain wall are single planes at
# the wall centre line. The existing walls, the concrete core and the
# columns are extruded polygons.
# The floor is at z = 0 and the suspended ceiling at z = 2.7 m. Doors are
# open. The origin is the south-west corner of the extracted plan region.
# It is 0.4 m west of the west curtain wall and 9.9 m south of the south
# one. x points east, y north.
# Run with an explicit output directory, for example
#   sbrsolver SBRSolver_rev2/data/large_office/large_office.ini results/large_office --view

[scene]
stl_file = walls_partition.stl   # new and existing drywall partitions, floor to ceiling
material = plaster_board
save_edges = false
save_faces = false

[geometry]
file = walls_exterior.stl        # curtain wall
material = glass

[geometry]
file = glazing.stl               # glazed partitions drawn as a single line
material = glass

[geometry]
file = core.stl                  # concrete core walls and columns, 8 in and thicker
material = concrete

[geometry]
file = screens.stl               # free-standing desk screens, 1.2 m
material = wood

[geometry]
file = floor.stl
material = concrete

[geometry]
file = ceiling.stl               # suspended ceiling at 2.7 m
material = plaster_board

[transmitter]
name = lab
position = 12.9 70.2 2.5           # centre of the lab, 0.2 m below the ceiling
coordinate_system = 1 0 0; 0 1 0; 0 0 1   # vertical dipole
power_watts = 0.1                # 20 dBm, a typical access point
frequency_hz = 2.44e9            # Wi-Fi channel 6
tessellation = 4                 # 2562 rays
antenna_type = hertzian_dipole

[transmitter]
name = east
position = 33.49 39.07 2.5         # above the east open workstations, 0.2 m below the ceiling
# power, frequency, tessellation and antenna as the first transmitter

[receivers]
layout = file
file = RX_large_office.dat

[ray_tracing]
max_reflections = 2
max_transmissions = 6
use_fresnel_coefficients = true
threads = 0

[material]
name = plaster_board
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 2.5
rel_permittivity_im = 0.3

[material]
name = concrete                  # ITU-R P.2040 at 2.4 GHz
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.09
rel_permittivity_re = 5.3
rel_permittivity_im = 0

[material]
name = glass
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.005
rel_permittivity_re = 6
rel_permittivity_im = 0.05

[material]
name = wood
reflection_loss = -1
transmission_loss = -1
rel_conductivity = 0.03
rel_permittivity_re = 1.8
rel_permittivity_im = 0.3

[outputs]
ray_paths = true
receivers = true
field_csv = true
icosahedron = false
viewer = false
