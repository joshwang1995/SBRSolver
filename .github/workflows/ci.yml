name: CI

on:
  push:            # every commit on every branch is compared with the reference solver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS (AppleClang)
            os: macos-latest
          - name: Windows (MSVC)
            os: windows-latest
            # CMake defaults SBR_RAYTUBE_EXE to tools/raytube/RayTubeTracing.exe
            # here, so the raytube_* tests run the reference solver itself; on
            # the other platforms they compare with its committed output.

    steps:
      - name: Check out sources and submodules (Eigen, Polyscope, Tracy)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the viewer's build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg-dev libglu1-mesa-dev libegl1-mesa-dev libxkbcommon-dev xvfb

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # SBR_REQUIRE_REFERENCE_TESTS: a runner without Python must fail here
        # rather than pass a test suite without the comparisons.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSBR_REQUIRE_REFERENCE_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run the scenes, the viewer tests and the reference comparison
        working-directory: build
        run: ctest -C Release --output-on-failure
